name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: Validate (Typecheck, Build & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup example Firebase config
        run: cp src/app/firebase-config.example.ts src/app/firebase-config.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build unified hosting bundle
        run: npm run build:hosting

      - name: Run unit tests
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless

  deploy:
    name: Deploy to Firebase Hosting
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup production Firebase config and targets
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          FIREBASE_PROJECT_ID: secret-santa-jgu7man
          FIREBASE_HOSTING_TARGETS: santa-secreto=santa-secreto
        run: node --experimental-strip-types scripts/setup-firebase-ci.ts

      - name: Typecheck production config
        run: npx tsc --noEmit

      - name: Build unified hosting bundle
        run: npm run build:hosting

      - name: Deploy to Firebase Hosting (santa-secreto)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SECRET_SANTA_JGU7MAN }}
          projectId: secret-santa-jgu7man
          target: santa-secreto
          channelId: live
