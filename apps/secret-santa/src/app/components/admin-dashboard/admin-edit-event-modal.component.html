<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
  role="dialog"
  aria-modal="true"
  aria-labelledby="edit-event-modal-title"
>
  <div class="ss-card ss-dialog max-w-md w-full">
    <h2
      id="edit-event-modal-title"
      class="text-2xl font-bold text-gray-900 mb-6"
      i18n="@@editEventTitle"
    >
      Edit Event
    </h2>

    <form [formGroup]="editForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label
          for="edit-event-name"
          class="block text-sm font-medium text-gray-700 mb-1"
          i18n="@@eventNameLabelSimple"
          >Event Name *</label
        >
        <input
          id="edit-event-name"
          type="text"
          formControlName="name"
          class="ss-field w-full"
        />
      </div>

      <div class="mb-4">
        <label
          for="edit-event-min-amount"
          class="block text-sm font-medium text-gray-700 mb-1"
          i18n="@@minAmountLabelSimple"
          >Minimum Gift Amount ($) *</label
        >
        <input
          id="edit-event-min-amount"
          type="number"
          formControlName="minAmount"
          class="ss-field w-full"
        />
      </div>

      <div class="mb-4">
        <label
          for="edit-event-max-amount"
          class="block text-sm font-medium text-gray-700 mb-1"
          i18n="@@maxAmountLabelSimple"
          >Maximum Gift Amount ($)</label
        >
        <input
          id="edit-event-max-amount"
          type="number"
          formControlName="maxAmount"
          class="ss-field w-full"
        />
      </div>

      <div class="mb-6">
        <label
          for="edit-event-deadline"
          class="block text-sm font-medium text-gray-700 mb-1"
          i18n="@@registrationDeadlineLabelSimple"
          >Registration Deadline</label
        >
        <input
          id="edit-event-deadline"
          type="datetime-local"
          formControlName="registrationDeadline"
          class="ss-field w-full"
        />
      </div>

      <div class="flex gap-3">
        <button
          type="button"
          (click)="closeModal.emit()"
          class="ss-button-secondary flex-1"
          i18n="@@cancelButton"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="editForm.invalid"
          class="ss-button-primary flex-1"
        >
          <span i18n="@@saveButtonSimple">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
